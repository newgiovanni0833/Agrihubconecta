<title>Quiz AgriHub · AgriHub Conecta 2027</title>

<style>
:root {
  --teal: #009F83;
  --verde: #07A550;
  --verde-texto: #06725C;     /* verde para textos pequenos (contraste 5,6:1 no branco) */
  --verde-claro: #E3F5EE;
  --tinta: #17302A;
  --suave: #4F635D;
  --linha: #D5E5DF;
  --fundo: #F3F7F6;
  --branco: #FFFFFF;
  --escuro: #26332F;
  --alerta: #8A4B00;
  --alerta-fundo: #FFF3DC;
  --erro: #A3281C;
  --erro-fundo: #FDECEA;
  --gradiente: linear-gradient(180deg, #009F83 0%, #03A26A 55%, #07A550 100%);
  --sombra: 0 18px 48px -24px rgba(10, 60, 45, .35), 0 2px 6px rgba(10, 60, 45, .06);
  --fonte: "Montserrat", "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--fonte);
  color: var(--tinta);
  background: linear-gradient(180deg, #E9EFF2 0%, #F6F8F8 340px, var(--fundo) 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  line-height: 1.5;
}
button, input, select { font: inherit; color: inherit; }
img { max-width: 100%; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Faixa do modo teste ---------- */
.faixa-teste {
  background: var(--alerta-fundo); color: var(--alerta); text-align: center;
  font-size: .85rem; font-weight: 600; padding: 8px 16px; border-bottom: 1px solid #F0D9A8;
}

/* ---------- Topo ---------- */
.topo { position: relative; padding: 0 16px; }
.topo-painel {
  position: relative; overflow: hidden;
  background: var(--gradiente);
  color: #fff;
  margin: 0 -16px;
  padding: 26px 24px 84px;
  border-radius: 0 0 40px 40px;
}
.topo-painel::before {        /* pontos e anéis da identidade AgriHub */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image:
    radial-gradient(circle, rgba(255,255,255,.55) 2.4px, transparent 2.9px),
    radial-gradient(circle, transparent 2.6px, rgba(255,255,255,.45) 3px, rgba(255,255,255,.45) 4px, transparent 4.4px);
  background-size: 22px 22px, 44px 44px;
  background-position: 0 0, 11px 11px;
  -webkit-mask-image: linear-gradient(90deg, #000 0, rgba(0,0,0,.6) 70px, transparent 190px);
          mask-image: linear-gradient(90deg, #000 0, rgba(0,0,0,.6) 70px, transparent 190px);
}
.topo-conteudo { position: relative; max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.logo { width: min(270px, 70vw); height: auto; display: block; }
.selo {
  margin: 0; display: inline-flex; align-self: flex-start; align-items: center; gap: 8px;
  font-size: .8rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
  padding: 7px 14px; border: 2px solid rgba(255,255,255,.85); border-radius: 999px;
}
.drone { display: none; }

/* ---------- Painel principal ---------- */
main { flex: 1; padding: 0 16px 40px; }
.painel {
  position: relative; max-width: 780px; margin: -56px auto 0;
  background: var(--branco); border-radius: 26px; box-shadow: var(--sombra);
  padding: 28px 22px 30px;
}
.painel.largo-admin { max-width: 1120px; }
h1, h2, h3 { margin: 0; line-height: 1.2; letter-spacing: -.01em; }
h1 { font-size: clamp(1.8rem, 6vw, 2.5rem); font-weight: 800; color: var(--teal); }
h2 { font-size: clamp(1.35rem, 4.6vw, 1.7rem); font-weight: 800; color: var(--teal); }
h3 { font-size: 1.05rem; font-weight: 700; color: var(--tinta); }
p { margin: 0; }
.lead { color: var(--suave); font-size: 1rem; }
.pilha { display: flex; flex-direction: column; gap: 18px; }
.pilha-p { display: flex; flex-direction: column; gap: 10px; }

.heroi { display: grid; gap: 18px; align-items: center; }
.heroi img { width: 100%; max-width: 420px; height: auto; justify-self: center; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
  background: var(--verde-claro); color: var(--verde-texto); font-weight: 700; font-size: .9rem;
}
.chip svg { flex: none; }

.regras { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.regras li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; color: var(--suave); font-size: .95rem; }
.regras li strong { color: var(--tinta); }
.icone-redondo {
  width: 34px; height: 34px; border-radius: 50%; background: var(--teal); color: #fff;
  display: inline-flex; align-items: center; justify-content: center;
}
.caixa { background: var(--fundo); border-radius: 18px; padding: 18px; }
.caixa h3 { margin-bottom: 12px; }

/* ---------- Formulários ---------- */
form { display: flex; flex-direction: column; gap: 16px; }
.campo { display: flex; flex-direction: column; gap: 6px; }
.campo label, .legenda { font-weight: 700; font-size: .95rem; }
.dica { color: var(--suave); font-size: .85rem; }
input[type=email], input[type=text], input[type=password] {
  width: 100%; padding: 14px 16px; border: 2px solid var(--linha); border-radius: 14px; background: #fff;
  font-size: 1rem; outline: none; transition: border-color .15s, box-shadow .15s;
}
input:focus { border-color: var(--teal); box-shadow: 0 0 0 4px rgba(0,159,131,.15); }
input[readonly] { background: var(--fundo); color: var(--suave); }
fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.perfis { display: grid; grid-template-columns: 1fr; gap: 8px; }
.perfil { position: relative; }
.perfil input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.perfil span {
  display: flex; align-items: center; gap: 12px; padding: 13px 14px; border: 2px solid var(--linha);
  border-radius: 14px; font-weight: 600; transition: border-color .15s, background .15s;
}
.perfil span::before {
  content: ""; flex: none; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #9DB3AB; background: #fff;
}
.perfil input:checked + span { border-color: var(--teal); background: var(--verde-claro); }
.perfil input:checked + span::before { border-color: var(--teal); box-shadow: inset 0 0 0 4px #fff; background: var(--teal); }
.perfil input:focus-visible + span { box-shadow: 0 0 0 4px rgba(0,159,131,.25); }

.botao {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 52px; padding: 12px 26px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--teal); color: #fff; font-weight: 800; font-size: 1rem; letter-spacing: .01em;
  box-shadow: 0 10px 22px -12px rgba(0,120,95,.8); transition: transform .12s, background .15s, opacity .15s;
  text-decoration: none;
}
.botao:hover { background: #008C73; }
.botao:active { transform: translateY(1px); }
.botao:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.botao:focus-visible, .link:focus-visible, .opcao:focus-visible, .vf button:focus-visible { outline: 3px solid #0B5E4D; outline-offset: 3px; }
.botao.secundario { background: #fff; color: var(--verde-texto); border: 2px solid var(--linha); box-shadow: none; }
.botao.secundario:hover { border-color: var(--teal); }
.botao.perigo { background: var(--erro); }
.botao.largo { width: 100%; }
.acoes { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.link { background: none; border: 0; padding: 4px 0; color: var(--verde-texto); font-weight: 700; text-decoration: underline; cursor: pointer; font-size: .92rem; }

.aviso { padding: 13px 16px; border-radius: 14px; font-size: .93rem; font-weight: 500; }
.aviso.erro { background: var(--erro-fundo); color: var(--erro); }
.aviso.info { background: var(--alerta-fundo); color: var(--alerta); }
.aviso.ok { background: var(--verde-claro); color: var(--verde-texto); }

.carregando { display: flex; align-items: center; justify-content: center; gap: 14px; min-height: 200px; color: var(--suave); font-weight: 600; }
.giro { width: 30px; height: 30px; border-radius: 50%; border: 4px solid var(--verde-claro); border-top-color: var(--teal); animation: girar .8s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }

/* ---------- Questões ---------- */
.barra-quiz { display: flex; flex-direction: column; gap: 12px; }
.linha-topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.bloco-rotulo { font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--verde-texto); }
.relogio {
  display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums;
  font-weight: 700; color: var(--suave); background: var(--fundo); padding: 5px 12px; border-radius: 999px; font-size: .9rem;
}
.progresso { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
.progresso span { height: 7px; border-radius: 4px; background: #DCE8E4; }
.progresso span.feita { background: var(--teal); }
.progresso span.atual { background: #8FD4C3; }
.contador { font-size: .9rem; color: var(--suave); font-weight: 600; }
.enunciado { font-size: clamp(1.1rem, 3.6vw, 1.3rem); font-weight: 700; line-height: 1.4; color: var(--tinta); }

.opcoes { display: flex; flex-direction: column; gap: 10px; }
.opcao {
  display: grid; grid-template-columns: 38px 1fr; gap: 12px; align-items: start; width: 100%; text-align: left;
  padding: 13px 14px; background: #fff; border: 2px solid var(--linha); border-radius: 16px; cursor: pointer;
  font-size: .98rem; line-height: 1.45; transition: border-color .15s, background .15s;
}
.opcao:hover { border-color: #9ED9C9; }
.opcao .letra {
  width: 38px; height: 38px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  background: var(--verde-claro); color: var(--verde-texto); font-weight: 800;
}
.opcao[aria-pressed=true] { border-color: var(--teal); background: var(--verde-claro); }
.opcao[aria-pressed=true] .letra { background: var(--teal); color: #fff; }
.opcao .texto { padding-top: 7px; }

.vf-lista { display: flex; flex-direction: column; gap: 10px; }
.vf-item { border: 2px solid var(--linha); border-radius: 16px; padding: 12px 14px; display: grid; gap: 10px; transition: border-color .15s; }
.vf-item.marcado { border-color: #A9DDCF; }
.vf-texto { display: grid; grid-template-columns: 26px 1fr; gap: 8px; font-size: .97rem; }
.vf-texto b { color: var(--verde-texto); }
.vf { display: inline-flex; justify-self: end; border: 2px solid var(--linha); border-radius: 999px; overflow: hidden; }
.vf button {
  border: 0; background: #fff; cursor: pointer; min-width: 112px; min-height: 44px; padding: 6px 14px; font-weight: 700; font-size: .92rem; color: var(--suave);
}
.vf button + button { border-left: 2px solid var(--linha); }
.vf button[aria-pressed=true].v { background: var(--teal); color: #fff; }
.vf button[aria-pressed=true].f { background: var(--escuro); color: #fff; }

.rodape-questao { display: flex; flex-direction: column; gap: 10px; }
.registrada { display: inline-flex; align-items: center; gap: 8px; color: var(--verde-texto); font-weight: 700; font-size: .92rem; min-height: 1.4em; }

.correcao { border-radius: 16px; padding: 16px; display: grid; gap: 6px; }
.correcao.certa { background: var(--verde-claro); color: var(--verde-texto); }
.correcao.parcial, .correcao.errada { background: var(--alerta-fundo); color: var(--alerta); }

/* ---------- Resultado ---------- */
.resultado { display: grid; gap: 22px; justify-items: center; text-align: center; }
.anel { position: relative; width: 200px; height: 200px; }
.anel svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.anel .numero { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.anel .numero strong { font-size: 3.1rem; font-weight: 800; color: var(--teal); line-height: 1; font-variant-numeric: tabular-nums; }
.anel .numero span { color: var(--suave); font-weight: 700; font-size: .95rem; }
.metricas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 480px; }
.metrica { background: var(--fundo); border-radius: 16px; padding: 14px 8px; display: grid; gap: 2px; align-content: start; }
.metrica strong { font-size: clamp(1.05rem, 4.4vw, 1.35rem); font-weight: 800; color: var(--tinta); font-variant-numeric: tabular-nums; }
.metrica span { font-size: .85rem; color: var(--suave); font-weight: 600; }
.infinito-final { width: min(320px, 80%); height: auto; }

/* ---------- Admin ---------- */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--fundo); border-radius: 16px; padding: 14px 16px; display: grid; gap: 2px; }
.kpi strong { font-size: 1.6rem; font-weight: 800; color: var(--teal); font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi span { font-size: .82rem; color: var(--suave); font-weight: 600; }
.tabela-rolagem { overflow-x: auto; border: 1px solid var(--linha); border-radius: 14px; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--linha); white-space: nowrap; }
th { background: var(--fundo); font-weight: 700; color: var(--suave); font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
td.quebra { white-space: normal; min-width: 220px; }
.pos { display: inline-flex; width: 28px; height: 28px; border-radius: 50%; align-items: center; justify-content: center; font-weight: 800; background: var(--fundo); }
.pos.top { background: var(--teal); color: #fff; }
.barra-h { display: grid; grid-template-columns: 1fr 46px; gap: 10px; align-items: center; min-width: 140px; }
.barra-h i { display: block; height: 10px; border-radius: 5px; background: #DCE8E4; overflow: hidden; }
.barra-h i b { display: block; height: 100%; background: var(--teal); border-radius: 5px; }
.abas { display: inline-flex; background: var(--fundo); padding: 4px; border-radius: 999px; gap: 4px; }
.abas button { border: 0; background: none; padding: 8px 16px; border-radius: 999px; font-weight: 700; cursor: pointer; color: var(--suave); }
.abas button[aria-pressed=true] { background: #fff; color: var(--verde-texto); box-shadow: 0 2px 6px rgba(0,0,0,.08); }
.status-quiz { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.ponto { width: 12px; height: 12px; border-radius: 50%; background: var(--verde); }
.ponto.fechado { background: var(--erro); }
.downloads { display: flex; flex-wrap: wrap; gap: 8px; }
.downloads a { font-size: .88rem; padding: 8px 14px; border-radius: 999px; border: 2px solid var(--linha); color: var(--verde-texto); font-weight: 700; text-decoration: none; }
.downloads a:hover { border-color: var(--teal); }
.secao { display: grid; gap: 12px; }
.secao + .secao { border-top: 1px solid var(--linha); padding-top: 22px; }

/* ---------- Rodapé ---------- */
.rodape { padding: 8px 16px 28px; display: flex; justify-content: center; }
.rodape img { width: min(440px, 92vw); height: auto; }

@media (min-width: 560px) {
  .perfis { grid-template-columns: 1fr 1fr; }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .vf-item { grid-template-columns: 1fr auto; align-items: center; }
  .vf { justify-self: end; }
  .vf button { min-width: 0; padding: 6px 16px; }
  .painel { padding: 36px 40px 40px; }
}
@media (min-width: 900px) {
  .topo { padding: 0; }
  .topo-painel { margin: 0; width: min(66%, 900px); padding: 40px 48px 112px max(48px, calc((100vw - 980px) / 2)); border-radius: 0 0 220px 0; }
  .logo { width: 320px; }
  .drone { display: block; position: absolute; right: max(32px, calc((100vw - 1100px) / 2)); top: 34px; width: 250px; height: auto; pointer-events: none; }
  .painel { margin-top: -72px; }
  .heroi { grid-template-columns: 1.1fr .9fr; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>

function tempoTexto(seg) {
  if (seg === null || seg === undefined) return "";
  const h = Math.floor(seg / 3600), m = Math.floor((seg % 3600) / 60), s = seg % 60;
  if (h) return `${h} h ${String(m).padStart(2, "0")} min`;
  return m ? `${m} min ${String(s).padStart(2, "0")} s` : `${s} s`;
}
function relogioTexto(seg) {
  const h = Math.floor(seg / 3600), m = Math.floor((seg % 3600) / 60), s = seg % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : String(m).padStart(2, "0")) + ":" + String(s).padStart(2, "0");
}

/* ---------- Comunicação com o servidor ----------
   Em picos de acesso o Google pode recusar a chamada; o app tenta de novo sozinho
   (até 4 vezes, com espera crescente e um pouco aleatória). */
const SEM_CONEXAO = "Não foi possível falar com o servidor. Verifique a conexão e tente de novo.";
const PICO = /simult|too many|muitos scripts|invoked too many|ocupado|timed out|tempo limite|failed to fetch|network|servidor/i;

function chamarUmaVez(acao, args) {
  return fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },   // evita a checagem CORS "preflight"
    body: JSON.stringify({ acao: acao, args: args })
  })
    .then(r => r.json())
    .catch(() => { const e = new Error(SEM_CONEXAO); e.repetir = true; throw e; })
    .then(j => {
      if (!j.ok) { const e = new Error(j.erro || SEM_CONEXAO); e.repetir = PICO.test(e.message) && !/chave|encerrado|concluiu|inválid/i.test(e.message); throw e; }
      return j.dados;
    });
}
async function chamar(acao, ...args) {
  if (!/^https:\/\/script\.google\.com\//.test(API_URL)) throw new Error("A página ainda não foi ligada ao servidor: cole a URL do Apps Script em API_URL.");
  const pausas = [1200, 2500, 5000, 9000];
  for (let tentativa = 0; ; tentativa++) {
    try { return await chamarUmaVez(acao, args); }
    catch (e) {
      if (!e.repetir || tentativa >= pausas.length) throw e;
      await esperar(pausas[tentativa] + Math.random() * 1500);
    }
  }
}
function carregando(texto) {
  painel().innerHTML = `<div class="carregando"><span class="giro" aria-hidden="true"></span>${esc(texto)}</div>`;
}
function aviso(texto, tipo = "erro") {
  return texto ? `<div class="aviso ${tipo}" role="${tipo === "erro" ? "alert" : "status"}">${esc(texto)}</div>` : "";
}
function rolarTopo() {
  const y = painel().getBoundingClientRect().top + window.scrollY - 16;
  if (window.scrollY > y) window.scrollTo({ top: y, behavior: "smooth" });
}

/* =========================================================
   TELA INICIAL
   ========================================================= */
async function iniciarApp() {
  if (TESTE) $("faixaTeste").hidden = false;
  if (MODO === "admin") { painel().classList.add("largo-admin"); return telaAdminLogin(); }
  carregando("Carregando o quiz…");
  try {
    info = await chamar("inicio", TESTE);
    telaInicial();
  } catch (e) {
    painel().innerHTML = `<div class="pilha">${aviso(e.message)}<div><button class="botao" type="button" id="tentar">Tentar de novo</button></div></div>`;
    $("tentar").onclick = iniciarApp;
  }
}

function regrasHtml() {
  const vf = info.vfModo === "tudo_ou_nada"
    ? "Nas questões de Verdadeiro ou Falso, a questão só pontua se todas as afirmativas estiverem certas."
    : `Nas questões de Verdadeiro ou Falso, cada afirmativa certa vale uma parte da questão (${num(info.pontosPorQuestao / 8)} ponto por afirmativa).`;
  return `
    <ul class="regras">
      <li><span class="icone-redondo">${ICONE.pontos}</span><span><strong>Cada questão vale ${num(info.pontosPorQuestao)} pontos</strong>, até ${info.pontuacaoMaxima} no total. ${esc(vf)}</span></li>
      <li><span class="icone-redondo">${ICONE.relogio}</span><span><strong>O tempo conta do clique em “Começar agora” até a última resposta</strong> e não pausa se você sair da página.</span></li>
      <li><span class="icone-redondo">${ICONE.trofeu}</span><span><strong>Classificação:</strong> mais pontos primeiro. No empate, menor tempo e, depois, quem concluiu primeiro.</span></li>
      <li><span class="icone-redondo">${ICONE.usuario}</span><span><strong>Uma participação por e-mail.</strong> Se a conexão cair, entre de novo com o mesmo e-mail e continue de onde parou.</span></li>
    </ul>`;
}

function telaInicial(erro) {
  pararRelogio();
  pessoa = null; quiz = null;
  const s = info.situacao;
  painel().innerHTML = `
    <div class="pilha">
      <div class="heroi">
        <div class="pilha-p">
          <h1>Quiz AgriHub</h1>
          <p class="lead">Missão de gamificação do AgriHub Conecta 2027. Responda sobre os conteúdos apresentados no Workshop AgriHub e some pontos para a missão.</p>
          <div class="chips">
            <span class="chip">${ICONE.lista}${info.totalQuestoes} questões</span>
            <span class="chip">${ICONE.blocos}${info.blocos.length} blocos</span>
            <span class="chip">${ICONE.estrela}até ${info.pontuacaoMaxima} pontos</span>
          </div>
        </div>
        <img src="${IMG_INFINITO}" alt="Símbolo do infinito formado por solo, lavoura, silos, satélite e máquinas agrícolas" width="569" height="331">
      </div>
      ${s.mensagem ? aviso(s.mensagem, s.aberto ? "ok" : "info") : ""}
      <div class="caixa"><h3>Como funciona</h3>${regrasHtml()}</div>
      <form id="formEmail" novalidate>
        <div class="campo">
          <label for="email">Seu e-mail</label>
          <input type="email" id="email" name="email" autocomplete="email" inputmode="email" placeholder="nome@exemplo.com" value="${esc(lembrado())}" required>
          <span class="dica">${info.dominios && info.dominios.length ? "Use um e-mail " + esc(info.dominios.map(d => "@" + d).join(" ou ")) + ". " : ""}Com ele você também pode continuar em outro aparelho.</span>
        </div>
        ${aviso(erro)}
        <button class="botao largo" type="submit">Continuar</button>
      </form>
    </div>`;
  $("formEmail").onsubmit = ev => { ev.preventDefault(); entrar($("email").value); };
}

async function entrar(email) {
  if (ocupado) return;
  email = String(email || "").trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return telaInicial("Confira o e-mail: ele precisa ter o formato nome@dominio.com.");
  ocupado = true;
  carregando("Conferindo seu e-mail…");
  try {
    pessoa = await chamar("entrar", email, TESTE);
    info.situacao = pessoa.situacao || info.situacao;
    lembrar(email);
    if (!pessoa.cadastrado) telaCadastro();
    else if (pessoa.status === "concluido") telaResultado(pessoa.resultado, true);
    else telaPronto();
  } catch (e) {
    telaInicial(e.message);
  } finally { ocupado = false; }
}

/* =========================================================
   CADASTRO
   ========================================================= */
function telaCadastro(erro, dados) {
  const d = dados || { nome: (pessoa.sugestao && pessoa.sugestao.nome) || "", perfil: (pessoa.sugestao && pessoa.sugestao.perfil) || "", sindicato: (pessoa.sugestao && pessoa.sugestao.sindicato) || "" };
  painel().innerHTML = `
    <div class="pilha">
      <div class="pilha-p">
        <h2>Faça seu cadastro</h2>
        <p class="lead">Leva menos de um minuto. Esses dados identificam sua pontuação na missão.</p>
      </div>
      <form id="formCadastro" novalidate>
        <div class="campo">
          <label for="cadEmail">E-mail</label>
          <input type="email" id="cadEmail" value="${esc(pessoa.email)}" readonly>
        </div>
        <div class="campo">
          <label for="cadNome">Nome completo</label>
          <input type="text" id="cadNome" autocomplete="name" maxlength="120" value="${esc(d.nome)}" required>
        </div>
        <fieldset>
          <legend class="legenda">Seu perfil</legend>
          <div class="perfis">
            ${info.perfis.map((p, i) => `
              <label class="perfil">
                <input type="radio" name="perfil" value="${esc(p)}" ${d.perfil === p ? "checked" : ""} ${i === 0 ? "required" : ""}>
                <span>${esc(p)}</span>
              </label>`).join("")}
          </div>
        </fieldset>
        <div class="campo">
          <label for="cadSindicato">Sindicato Rural ou Regional em que atua</label>
          <input type="text" id="cadSindicato" maxlength="120" placeholder="Ex.: Sindicato Rural de Sorriso" value="${esc(d.sindicato)}" required>
        </div>
        ${aviso(erro)}
        <button class="botao largo" type="submit">Cadastrar e continuar</button>
        <button class="link" type="button" id="trocarEmail">Usar outro e-mail</button>
      </form>
    </div>`;
  $("trocarEmail").onclick = () => { lembrar(""); telaInicial(); };
  $("formCadastro").onsubmit = async ev => {
    ev.preventDefault();
    if (ocupado) return;
    const marcado = document.querySelector('input[name=perfil]:checked');
    const dados = { email: pessoa.email, nome: $("cadNome").value.trim(), perfil: marcado ? marcado.value : "", sindicato: $("cadSindicato").value.trim() };
    if (dados.nome.split(/\s+/).length < 2) return telaCadastro("Informe seu nome completo (nome e sobrenome).", dados);
    if (!dados.perfil) return telaCadastro("Escolha o seu perfil.", dados);
    if (dados.sindicato.length < 2) return telaCadastro("Informe o Sindicato Rural ou a Regional em que você atua.", dados);
    ocupado = true;
    carregando("Salvando seu cadastro…");
    try {
      pessoa = await chamar("cadastrar", dados, TESTE);
      if (pessoa.status === "concluido") telaResultado(pessoa.resultado, true);
      else telaPronto();
    } catch (e) {
      telaCadastro(e.message, dados);
    } finally { ocupado = false; }
  };
}

/* =========================================================
   PRONTO PARA COMEÇAR
   ========================================================= */
function telaPronto(erro) {
  const s = info.situacao;
  const continuar = pessoa.status === "andamento";
  painel().innerHTML = `
    <div class="pilha">
      <div class="pilha-p">
        <h2>${pessoa.nome ? "Olá, " + esc(pessoa.nome) + "!" : "Tudo pronto!"}</h2>
        <p class="lead">${esc(pessoa.perfil)} · ${esc(pessoa.sindicato)}</p>
      </div>
      ${continuar
        ? aviso(`Você já respondeu ${pessoa.respondidas} de ${pessoa.total} questões. O tempo continua contando desde o seu início.`, "info")
        : `<div class="caixa"><h3>Antes de começar</h3>${regrasHtml()}</div>`}
      ${!s.aberto ? aviso(s.mensagem, "info") : ""}
      ${aviso(erro)}
      <div class="acoes">
        ${s.aberto ? `<button class="botao" type="button" id="comecar">${continuar ? "Continuar de onde parei" : "Começar agora"}</button>` : ""}
        <button class="link" type="button" id="trocarEmail">Não é você? Trocar e-mail</button>
      </div>
    </div>`;
  if ($("comecar")) $("comecar").onclick = comecar;
  $("trocarEmail").onclick = () => { lembrar(""); telaInicial(); };
}

async function comecar() {
  if (ocupado) return;
  ocupado = true;
  carregando("Preparando as questões…");
  try {
    quiz = await chamar("iniciar", pessoa.email, TESTE);
    quiz.desvio = Date.now() - new Date(quiz.agora).getTime();   // diferença entre o relógio do aparelho e o do servidor
    atual = proximaPendente(0);
    escolha = null;
    iniciarRelogio();
    renderQuestao();
  } catch (e) {
    telaPronto(e.message);
  } finally { ocupado = false; }
}

/* =========================================================
   QUESTÕES
   ========================================================= */
const respondida = q => quiz.respondidas[q.id] !== undefined;
function proximaPendente(de) {
  for (let i = de; i < quiz.questoes.length; i++) if (!respondida(quiz.questoes[i])) return i;
  for (let i = 0; i < de; i++) if (!respondida(quiz.questoes[i])) return i;
  return -1;
}
function segundosDecorridos() {
  if (!quiz || !quiz.inicio) return 0;
  return Math.max(0, Math.floor((Date.now() - quiz.desvio - new Date(quiz.inicio).getTime()) / 1000));
}
function iniciarRelogio() {
  pararRelogio();
  relogio = setInterval(() => { const r = $("relogioValor"); if (r) r.textContent = relogioTexto(segundosDecorridos()); }, 1000);
}
function pararRelogio() { if (relogio) clearInterval(relogio); relogio = null; }

function renderQuestao(mensagem, erro) {
  const q = quiz.questoes[atual];
  const bloco = quiz.blocos.find(b => b.n === q.bloco);
  const feitas = Object.keys(quiz.respondidas).length;
  const total = quiz.questoes.length;
  const corpo = q.tipo === "multipla" ? opcoesHtml(q) : vfHtml(q);
  painel().innerHTML = `
    <div class="pilha">
      <div class="barra-quiz">
        <div class="linha-topo">
          <span class="bloco-rotulo">Bloco ${q.bloco} · ${esc(bloco ? bloco.titulo : "")}</span>
          <span class="relogio" title="Tempo desde o início">${ICONE.relogio}<span id="relogioValor">${relogioTexto(segundosDecorridos())}</span><span class="sr-only"> de tempo</span></span>
        </div>
        <div class="progresso" aria-hidden="true">${quiz.questoes.map((x, i) => `<span class="${respondida(x) ? "feita" : (i === atual ? "atual" : "")}"></span>`).join("")}</div>
        <span class="contador">Questão ${atual + 1} de ${total} · ${feitas} respondida${feitas === 1 ? "" : "s"}</span>
      </div>
      <h2 class="enunciado" id="enunciado" tabindex="-1">${esc(q.texto)}</h2>
      ${corpo}
      <div class="rodape-questao">
        ${aviso(erro)}
        <span class="registrada" role="status">${mensagem ? ICONE.check + esc(mensagem) : ""}</span>
        <button class="botao largo" type="button" id="confirmar" disabled>${q.tipo === "vf" ? "Confirmar respostas" : "Confirmar resposta"}</button>
      </div>
    </div>`;
  ligarQuestao(q);
  $("enunciado").focus({ preventScroll: true });
  rolarTopo();
}

function opcoesHtml(q) {
  return `<div class="opcoes" role="group" aria-labelledby="enunciado">
    ${q.opcoes.map((o, i) => `
      <button type="button" class="opcao" data-k="${esc(o.k)}" aria-pressed="${escolha === o.k}">
        <span class="letra" aria-hidden="true">${LETRAS[i]}</span><span class="texto"><span class="sr-only">Alternativa ${LETRAS[i]}: </span>${esc(o.t)}</span>
      </button>`).join("")}
  </div>`;
}

function vfHtml(q) {
  if (!Array.isArray(escolha)) escolha = q.afirmativas.map(() => "");
  return `<p class="dica" id="vfContagem"></p>
  <div class="vf-lista">
    ${q.afirmativas.map((a, i) => `
      <div class="vf-item ${escolha[i] ? "marcado" : ""}" data-i="${i}">
        <p class="vf-texto" id="af${i}"><b>${esc(a.k)})</b><span>${esc(a.t)}</span></p>
        <div class="vf" role="group" aria-labelledby="af${i}">
          <button type="button" class="v" data-i="${i}" data-v="V" aria-pressed="${escolha[i] === "V"}">Verdadeiro</button>
          <button type="button" class="f" data-i="${i}" data-v="F" aria-pressed="${escolha[i] === "F"}">Falso</button>
        </div>
      </div>`).join("")}
  </div>`;
}

function ligarQuestao(q) {
  const botao = $("confirmar");
  if (q.tipo === "multipla") {
    painel().querySelectorAll(".opcao").forEach(b => b.onclick = () => {
      escolha = b.dataset.k;
      painel().querySelectorAll(".opcao").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      botao.disabled = false;
    });
    botao.disabled = !escolha;
  } else {
    const atualizar = () => {
      const n = escolha.filter(Boolean).length;
      $("vfContagem").textContent = `${n} de ${escolha.length} afirmativas marcadas. Marque Verdadeiro ou Falso em todas para confirmar.`;
      botao.disabled = n < escolha.length;
    };
    painel().querySelectorAll(".vf button").forEach(b => b.onclick = () => {
      const i = Number(b.dataset.i);
      escolha[i] = b.dataset.v;
      b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      b.closest(".vf-item").classList.add("marcado");
      atualizar();
    });
    atualizar();
  }
  botao.onclick = () => confirmar(q);
}

async function confirmar(q) {
  if (ocupado) return;
  const resposta = q.tipo === "vf" ? escolha.join("") : escolha;
  if (!resposta || (q.tipo === "vf" && resposta.length < q.afirmativas.length)) return;
  ocupado = true;
  const botao = $("confirmar");
  botao.disabled = true;
  botao.textContent = "Registrando…";
  try {
    const r = await chamar("responder", pessoa.email, q.id, resposta, TESTE);
    quiz.respondidas[q.id] = r.correcao || true;
    escolha = null;
    if (r.concluido) { pararRelogio(); return telaResultado(r.resultado, false); }
    if (quiz.mostrarCorrecao && r.correcao) return telaCorrecao(q, r.correcao);
    atual = proximaPendente(atual + 1);
    renderQuestao("Resposta registrada.");
  } catch (e) {
    if (/concluiu/i.test(e.message)) { pararRelogio(); return entrar(pessoa.email); }
    renderQuestao("", e.message);
  } finally { ocupado = false; }
}

function telaCorrecao(q, c) {
  const tipo = c.pontos >= c.possiveis ? "certa" : (c.pontos > 0 ? "parcial" : "errada");
  let texto;
  if (q.tipo === "vf") {
    const gab = c.correta.split("").map((v, i) => `${q.afirmativas[i].k}) ${v}`).join(" · ");
    texto = `Você acertou ${c.certas} de ${c.total} afirmativas e fez ${num(c.pontos)} de ${num(c.possiveis)} pontos. Gabarito: ${gab}.`;
  } else {
    const i = q.opcoes.findIndex(o => o.k === c.correta);
    texto = tipo === "certa" ? `Resposta certa: +${num(c.pontos)} pontos.` : `A resposta certa é a alternativa ${LETRAS[i]}: ${q.opcoes[i].t}`;
  }
  painel().innerHTML = `
    <div class="pilha">
      <h2 class="enunciado">${esc(q.texto)}</h2>
      <div class="correcao ${tipo}" role="status"><strong>${tipo === "certa" ? "Isso mesmo!" : (tipo === "parcial" ? "Quase tudo certo." : "Não foi desta vez.")}</strong><span>${esc(texto)}</span></div>
      <button class="botao largo" type="button" id="proxima">Próxima questão</button>
    </div>`;
  $("proxima").onclick = () => { atual = proximaPendente(atual + 1); renderQuestao(); };
  $("proxima").focus();
}

/* =========================================================
   RESULTADO
   ========================================================= */
function telaResultado(r, jaConcluido) {
  pararRelogio();
  const frac = r.maximo ? Math.max(0, Math.min(1, r.pontos / r.maximo)) : 0;
  const circ = 2 * Math.PI * 86;
  painel().innerHTML = `
    <div class="resultado">
      <div class="pilha-p">
        <h2>${jaConcluido ? "Você já concluiu o Quiz AgriHub" : "Missão concluída!"}</h2>
        <p class="lead">${jaConcluido ? "Cada e-mail participa uma única vez. Este é o seu resultado registrado." : "Suas respostas foram registradas e a pontuação já conta para a missão."}</p>
      </div>
      <div class="anel" role="img" aria-label="${num(r.pontos)} de ${r.maximo} pontos">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle cx="100" cy="100" r="86" fill="none" stroke="#E3F5EE" stroke-width="18"/>
          <circle cx="100" cy="100" r="86" fill="none" stroke="#009F83" stroke-width="18" stroke-linecap="round"
            stroke-dasharray="${(circ * frac).toFixed(1)} ${circ.toFixed(1)}"/>
        </svg>
        <div class="numero" aria-hidden="true"><strong>${num(r.pontos)}</strong><span>de ${r.maximo} pontos</span></div>
      </div>
      <div class="metricas">
        <div class="metrica"><strong>${num(r.pontos)}</strong><span>pontos</span></div>
        <div class="metrica"><strong>${r.certas}/${r.total}</strong><span>questões 100% certas</span></div>
        <div class="metrica"><strong>${esc(tempoTexto(r.segundos))}</strong><span>tempo total</span></div>
      </div>
      <img class="infinito-final" src="${IMG_INFINITO}" alt="" aria-hidden="true">
      ${TESTE ? `<div class="acoes"><button class="botao secundario" type="button" id="refazer">Refazer (só no link de teste)</button></div>` : ""}
      <button class="link" type="button" id="sair">Sair</button>
    </div>`;
  if ($("refazer")) $("refazer").onclick = async () => {
    carregando("Apagando o teste…");
    try { await chamar("zerarTeste", pessoa.email, true); await entrar(pessoa.email); }
    catch (e) { telaInicial(e.message); }
  };
  $("sair").onclick = () => { lembrar(""); telaInicial(); };
  rolarTopo();
}

/* =========================================================
   PAINEL DO ADMINISTRADOR  (link com ?admin)
   ========================================================= */
let chaveAdmin = "";
let dadosAdmin = null;
let visaoAdmin = "real";

function telaAdminLogin(erro) {
  painel().innerHTML = `
    <div class="pilha">
      <div class="pilha-p">
        <h2>Painel do administrador</h2>
        <p class="lead">Ranking, métricas por questão e downloads do Quiz AgriHub.</p>
      </div>
      <form id="formAdmin" novalidate>
        <div class="campo">
          <label for="chave">Chave de administrador</label>
          <input type="password" id="chave" autocomplete="current-password" required>
        </div>
        ${aviso(erro)}
        <button class="botao largo" type="submit">Entrar</button>
      </form>
    </div>`;
  $("formAdmin").onsubmit = ev => { ev.preventDefault(); chaveAdmin = $("chave").value; acaoAdmin("painelAdmin"); };
  $("chave").focus();
}

async function acaoAdmin(acao, confirmacao) {
  if (confirmacao && !confirm(confirmacao)) return;
  if (ocupado) return;
  ocupado = true;
  carregando("Carregando o painel…");
  try {
    dadosAdmin = await chamar(acao, chaveAdmin);
    telaAdmin();
  } catch (e) {
    if (/chave/i.test(e.message) || !dadosAdmin) telaAdminLogin(e.message);
    else telaAdmin(e.message);
  } finally { ocupado = false; }
}

function tabelaRanking(lista) {
  if (!lista.length) return `<p class="dica">Ninguém concluiu o quiz ainda.</p>`;
  return `<div class="tabela-rolagem"><table>
    <thead><tr><th class="num">Pos.</th><th>Nome</th><th>Perfil</th><th>Sindicato / Regional</th><th class="num">Pontos</th><th class="num">Certas</th><th class="num">Tempo</th><th class="num" title="Ordem de conclusão">Ordem</th><th>Concluiu em</th></tr></thead>
    <tbody>${lista.map(x => `<tr>
      <td class="num"><span class="pos ${x.posicao <= 3 ? "top" : ""}">${x.posicao}</span></td>
      <td>${esc(x.nome)}<br><span class="dica">${esc(x.email)}</span></td>
      <td>${esc(x.perfil)}</td><td>${esc(x.sindicato)}</td>
      <td class="num"><strong>${num(x.pontos)}</strong></td><td class="num">${x.certas}</td>
      <td class="num">${esc(x.tempo)}</td><td class="num">${x.ordem}º</td><td>${esc(x.concluiuEm)}</td>
    </tr>`).join("")}</tbody></table></div>`;
}

      ${tabelaRanking(est.ranking)}
    </div>
    <div class="secao">
      <h3>Por perfil</h3>
      ${est.porPerfil.length ? `<div class="tabela-rolagem"><table>
        <thead><tr><th>Perfil</th><th class="num">Cadastrados</th><th class="num">Concluíram</th><th class="num">Média de pontos</th></tr></thead>
        <tbody>${est.porPerfil.map(p => `<tr><td>${esc(p.perfil)}</td><td class="num">${p.cadastrados}</td><td class="num">${p.concluiram}</td><td class="num">${p.concluiram ? num(p.mediaPontos) : "–"}</td></tr>`).join("")}</tbody>
      </table></div>` : `<p class="dica">Sem cadastros ainda.</p>`}
    </div>
    <div class="secao">
      <h3>Aproveitamento por questão</h3>
      <p class="dica">Percentual médio dos pontos possíveis em cada questão, entre quem já respondeu.</p>
      <div class="tabela-rolagem"><table>
        <thead><tr><th class="num">Nº</th><th>Questão</th><th class="num">Respostas</th><th>Aproveitamento</th></tr></thead>
        <tbody>${est.porQuestao.map(q => `<tr><td class="num">${q.id}</td><td class="quebra">${esc(q.texto)}</td><td class="num">${q.respostas}</td>
          <td>${q.aproveitamento === null ? "–" : `<span class="barra-h"><i><b style="width:${q.aproveitamento}%"></b></i><span>${q.aproveitamento}%</span></span>`}</td></tr>`).join("")}</tbody>
      </table></div>
    </div>
    <div class="secao">
      <h3>Baixar ${teste ? "dados de teste" : "dados"}</h3>
      <div class="downloads">
        ${teste ? "" : `<a href="${esc(dadosAdmin.xlsx)}" target="_blank" rel="noopener">Planilha completa (.xlsx)</a><a href="${esc(dadosAdmin.planilha)}" target="_blank" rel="noopener">Abrir no Google Planilhas</a>`}
        ${arquivos.map(a => `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.nome)} (.csv · ${a.linhas})</a>`).join("")}
      </div>
    </div>`;
}

function telaAdmin(erro) {
  const d = dadosAdmin;
  const s = d.situacao;
  const teste = visaoAdmin === "teste";
  const base = location.href.split("?")[0];
  painel().innerHTML = `
    <div class="pilha">
      <div class="linha-topo">
        <h2>Painel do administrador</h2>
        <div class="abas" role="group" aria-label="Dados exibidos">
          <button type="button" id="verReal" aria-pressed="${!teste}">Oficial</button>
          <button type="button" id="verTeste" aria-pressed="${teste}">Teste</button>
        </div>
      </div>
      <p class="dica">Atualizado em ${esc(d.geradoEm)} · ${num(d.regras.pontosPorQuestao)} pontos por questão · V ou F: ${d.regras.vfModo === "tudo_ou_nada" ? "tudo ou nada" : "proporcional"} · correção na hora: ${d.regras.mostrarCorrecao ? "sim" : "não"} · lista de credenciados: ${d.regras.usarLista ? "sim" : "não"}</p>
      ${aviso(erro)}
      ${teste ? `
        <div class="secao">
          <div class="aviso info">Dados do link de teste (${esc(base)}?teste). Não contam para a missão.</div>
          <div class="acoes"><button class="botao perigo" type="button" id="limparTeste">Apagar dados de teste</button></div>
        </div>
        ${blocoEstatisticas(d.teste, d.arquivosTeste, true)}` : `
        <div class="secao">
          <div class="status-quiz"><span class="ponto ${s.aberto ? "" : "fechado"}" aria-hidden="true"></span>${s.aberto ? "Quiz aberto" : "Quiz fechado"}</div>
          ${s.mensagem ? `<p class="dica">${esc(s.mensagem)}</p>` : ""}
          ${d.encerramentoAutomatico ? `<p class="dica">Encerramento automático: ${esc(d.encerramentoAutomatico)}</p>` : ""}
          <div class="acoes">
            ${s.aberto ? `<button class="botao perigo" type="button" id="encerrar">Encerrar o quiz agora</button>` : (s.antes ? "" : `<button class="botao" type="button" id="reabrir">Reabrir o quiz</button>`)}
            <button class="botao secundario" type="button" id="atualizar">Atualizar</button>
          </div>
        </div>
        ${blocoEstatisticas(d.real, d.arquivos, false)}`}
    </div>`;
  $("verReal").onclick = () => { visaoAdmin = "real"; telaAdmin(); };
  $("verTeste").onclick = () => { visaoAdmin = "teste"; telaAdmin(); };
  if ($("atualizar")) $("atualizar").onclick = () => acaoAdmin("painelAdmin");
  if ($("encerrar")) $("encerrar").onclick = () => acaoAdmin("encerrarQuiz", "Encerrar o quiz agora? Ninguém mais conseguirá começar ou responder.");
  if ($("reabrir")) $("reabrir").onclick = () => acaoAdmin("reabrirQuiz", "Reabrir o quiz para novas respostas?");
  if ($("limparTeste")) $("limparTeste").onclick = () => acaoAdmin("limparTestes", "Apagar todos os dados das abas TESTE?");
}

iniciarApp();
</script>
</body>
</html>
